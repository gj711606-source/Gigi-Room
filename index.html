<!doctype html>
<html lang="zh-CN">
<head>

  <title>冰箱里还有冰糖</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #192323;
      color: #f3ead8;

    }
    main { padding: 24px; }

      padding: 14px 24px;

<body>
  <main>
    <p>🌙 夜里还亮着</p >
    <h1>冰箱里还有冰糖</h1>

    <button onclick="this.textContent='🍬 找到了，分你一颗。'">

    </button>
  </main>

</html>
